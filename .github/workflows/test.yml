name: Tests

on:
    push:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@v4

          - name: Install dependencies
            run: |
                sudo apt-get update
                sudo apt-get install -y verilator binutils-riscv64-unknown-elf
                curl https://mise.run | sh
                curl -LsSf https://astral.sh/uv/install.sh | sh

          - name: Run integration tests
            run: make test

          - name: Run certification tests
            run: |
                make act-clone
                make act-config
                make act-build
                make regress
