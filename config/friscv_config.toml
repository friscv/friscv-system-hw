# FRISC-V configuration
# Keys are the SystemVerilog parameter names in friscv_pkg.sv.
# Regenerate the package with:  python3 build.py config

# Set this to 0 for debugging
ZSBL_ROM_SIZE_BYTES = 1024
# If enabled, buffer outbound requests to improve timing
ENABLE_L2_BUFFER = true
# Memory protection and address translation
ENABLE_MMU = true
ENFORCE_PMP = true
ENFORCE_PTW_PMP = false
PMP_ENTRIES = 16
PMP_USABLE = 5
# Must be a power of 2 greater than 1
ITLB_ENTRIES = 4
DTLB_ENTRIES = 8
# If not enabled, any sfence.vma will flush all TLB entries
ENABLE_FINE_TLB_FLUSH = true
# Extension selection
ENABLE_MUL = true
ENABLE_DIV = true
ENABLE_EXTENSION_A = true
# ALWAYS ENABLED ENABLE_EXTENSION_ZICSR = true
ENABLE_EXTENSION_ZIFENCEI = true
# ALWAYS ENABLED ENABLE_EXTENSION_ZICNTR = true
# ALWAYS ENABLED ENABLE_EXTENSION_SSTC = true
# If enabled, a write to END_ADDRESS will stall the core until reset
ENABLE_HALT_ON_END_ADDRESS = true
# If enabled, entering an EBREAK instruction will halt the core until reset
ENABLE_HALT_ON_ENTER_EBREAK = false
# If enabled, the first MRET or SRET after entering an EBREAK handler will halt the core until reset
ENABLE_HALT_ON_RET_FROM_EBREAK = false
